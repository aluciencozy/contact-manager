 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Contact Manager</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/contacts.js"></script>
    <script type="module" src="js/auth.js"></script>
  </head>

  <body>

    <div id="contactsContainer" class="contacts-container">
      
      <h1 class="contacts-title">Contacts</h1>

      <button id="logoutButton" class="logoutButton">Logout</button>

      <div class= "search-add-container">
        <input type="search" id="search" placeholder="Search contacts..." />
        
        <button id="addContactButton" class="addContactButton" type="button">Add Contact</button>
      </div>

      <p id="contactResultMessage" class="result-message"></p>

      <!-- Add Contact Modal -->
      <dialog id="addContactDialog" closedby="any"> 

        <div class="form-container">  

          <h2>Add Contact</h2>

          <form id="addContactForm" action="">

            <div class="form-group">
              <label>First Name
                <input name="first_name" required>
              </label>
            </div>

            <div class="form-group">
              <label>
                Last name
                <input name="last_name" required>
              </label>
            </div>

          <div class="form-group">
              <label>
                Email
                <input name="email" type="email">
              </label>
          </div>

          <div class="form-group">
              <label>
                Phone Number
                <input name="phone_number" required>
              </label>
          </div>

            <button type="submit" class="form-btn">Add Contact</button>
            <button id="addCancelContactButton" type="button" class="form-btn">Cancel</button>

          </form>
        </div>
      </dialog>

      <!-- Edit Contact Modal -->
      <dialog id="editContactDialog" closedby="any"> 

        <div class="form-container">  

          <h2>Edit Contact</h2>

          <form id="editContactForm" action="">

            <div class="form-group">
              <label>First Name
                <input name="first_name" required>
              </label>
            </div>

            <div class="form-group">
              <label>
                Last name
                <input name="last_name" required>
              </label>
            </div>

          <div class="form-group">
              <label>
                Email
                <input name="email" type="email">
              </label>
          </div>

          <div class="form-group">
              <label>
                Phone Number
                <input name="phone_number" required>
              </label>
          </div>

            <button type="submit" class="form-btn">Save Changes</button>
            <button id="editCancelContactButton" type="button" class="form-btn">Cancel</button>

          </form>
        </div>
      </dialog>

      <!-- Delete Contact Modal -->

      <dialog id="deleteContactDialog" class="deleteDialog" closedby="any">
          <h2>Delete this contact?</h2>
        <div class="deleteButtonContainer">
          <button type="button" class="deleteButtonYes" id="deleteButtonYes">Delete</button>
          <button type="button" class="deleteButtonNo" id="deleteButtonNo">Cancel</button>
        </div>
      </dialog>
      

      <!-- Results, Edit, and Delete Table Container -->
      <div class="contacts-table-container">
        <table class="contacts-table">

          <thead>
            <tr>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Phone Number</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="contactsTableBody">
            <!-- JS will put contacts here -->
          </tbody>

        </table>
      </div>
    </div>

  </body>
</html>
